<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">appaudit workflow</title><desc id="d">Who does what in an assessment: main agent, parallel reviewers, scripts, verifier and regulatory mapper.</desc>
<defs><marker id="a334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a1D4ED8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="a0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="a6D28D9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="aB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="aB42318" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs>
<rect width="1200" height="664" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="36" y="48" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start">How an assessment runs</text>
<text x="36" y="74" font-size="14" font-weight="400" fill="#475569" text-anchor="start">No agent grades its own work: finding, verifying and legal mapping are done by different agents; merging and reporting are code</text>
<rect x="30" y="104" width="1140" height="112" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
<text x="46" y="130" font-size="14" font-weight="800" fill="#1D4ED8" text-anchor="start">Main agent</text>
<text x="46" y="148" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">talks to you, touches targets</text>
<rect x="30" y="236" width="1140" height="112" rx="10" fill="#F0FDFA" stroke="#CBD5E1" stroke-width="1"/>
<text x="46" y="262" font-size="14" font-weight="800" fill="#0F766E" text-anchor="start">Reviewer agents</text>
<text x="46" y="280" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">read-only, in parallel</text>
<rect x="30" y="368" width="1140" height="112" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="46" y="394" font-size="14" font-weight="800" fill="#334155" text-anchor="start">Scripts</text>
<text x="46" y="412" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">deterministic, no model</text>
<rect x="30" y="500" width="1140" height="112" rx="10" fill="#F5F3FF" stroke="#CBD5E1" stroke-width="1"/>
<text x="46" y="526" font-size="14" font-weight="800" fill="#6D28D9" text-anchor="start">Checking agents</text>
<text x="46" y="544" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">read-only, independent</text>
<rect x="200" y="144" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="275.0" y="169" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Update check</text>
<text x="275.0" y="186" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">first line of the reply</text>
<rect x="362" y="144" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="437.0" y="169" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Scope</text>
<text x="437.0" y="186" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">permission, hosts,</text>
<text x="437.0" y="199" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">window</text>
<rect x="524" y="144" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="599.0" y="169" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Recon</text>
<text x="599.0" y="186" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">map the target, assign</text>
<text x="599.0" y="199" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">files</text>
<rect x="848" y="144" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="923.0" y="169" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Validate, score</text>
<text x="923.0" y="186" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">benign proofs in scope</text>
<rect x="686" y="276" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
<text x="761.0" y="301" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">6 reviewers</text>
<text x="761.0" y="318" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">one per module, side by</text>
<text x="761.0" y="331" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">side</text>
<rect x="524" y="408" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="599.0" y="433" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Extension scan</text>
<text x="599.0" y="450" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">scan_extension.py</text>
<rect x="686" y="408" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="761.0" y="433" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Merge</text>
<text x="761.0" y="450" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">one finding per root</text>
<text x="761.0" y="463" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">cause</text>
<rect x="1010" y="408" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="1085.0" y="433" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Build outputs</text>
<text x="1085.0" y="450" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">validates, then 6 files</text>
<rect x="848" y="540" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="923.0" y="565" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Verifier</text>
<text x="923.0" y="582" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">evidence only, starts</text>
<text x="923.0" y="595" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">from doubt</text>
<rect x="1010" y="540" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1085.0" y="565" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Regulatory mapper</text>
<text x="1085.0" y="582" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">two-tier flags</text>
<line x1="350" y1="175.0" x2="360" y2="175.0" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#a1D4ED8)"/>
<line x1="512" y1="175.0" x2="522" y2="175.0" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#a1D4ED8)"/>
<path d="M674 185.0 L726 185.0 L726 274" fill="none" stroke="#0F766E" stroke-width="1.8" marker-end="url(#a0F766E)"/>
<line x1="599.0" y1="206" x2="599.0" y2="406" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a334155)"/>
<line x1="674" y1="439.0" x2="684" y2="439.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a334155)"/>
<line x1="761.0" y1="338" x2="761.0" y2="406" stroke="#0F766E" stroke-width="1.8" marker-end="url(#a0F766E)"/>
<path d="M836 427.0 L903.0 427.0 L903.0 208" fill="none" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#a1D4ED8)"/>
<path d="M943.0 206 L943.0 538" fill="none" stroke="#6D28D9" stroke-width="1.8" marker-end="url(#a6D28D9)"/>
<line x1="998" y1="571.0" x2="1008" y2="571.0" stroke="#6D28D9" stroke-width="1.8" marker-end="url(#a6D28D9)"/>
<line x1="1085.0" y1="540" x2="1085.0" y2="472" stroke="#334155" stroke-width="1.8" marker-end="url(#a334155)"/>
<rect x="1010" y="144" width="150" height="62" rx="9" fill="#0F172A" stroke="#0F172A" stroke-width="1.2"/>
<text x="1085.0" y="169" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Six outputs</text>
<text x="1085.0" y="187" font-size="11" font-weight="400" fill="#CBD5E1" text-anchor="middle">+ hashes, re-test delta</text>
<line x1="1085.0" y1="408" x2="1085.0" y2="208" stroke="#334155" stroke-width="1.8" marker-end="url(#a334155)"/>
<text x="607.0" y="228" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start">extensions</text>
<text x="46" y="640" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">Scope guard and evidence log (hooks) run under every step in Claude Code and Cowork.</text>
<text x="1170" y="646" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="end">github.com/unipicto/appaudit</text>
</svg>
