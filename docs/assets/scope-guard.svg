<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">appaudit scope guard</title><desc id="d">How the scope guard answers each tool call: deny, ask or pass.</desc>
<defs><marker id="a334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a1D4ED8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="a0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="a6D28D9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="aB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="aB42318" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs>
<rect width="1200" height="560" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="36" y="48" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start">The scope guard: deny, ask or pass</text>
<text x="36" y="74" font-size="14" font-weight="400" fill="#475569" text-anchor="start">A hook that checks every Bash, WebFetch, file-write and MCP call before it runs. A guard rail, not a sandbox</text>
<rect x="36" y="110" width="190" height="76" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="131" y="142" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Tool call</text>
<text x="131" y="162" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">from Claude or a sub-agent</text>
<rect x="290" y="110" width="240" height="76" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="410" y="142" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Engagement open?</text>
<text x="410" y="162" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">.appaudit/scope.json</text>
<line x1="228" y1="148" x2="286" y2="148" stroke="#334155" stroke-width="1.8" marker-end="url(#a334155)"/>
<rect x="600" y="110" width="564" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="618" y="136" font-size="13" font-weight="700" fill="#334155" text-anchor="start">No engagement</text>
<text x="618" y="156" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">A scanning tool (nmap, sqlmap, nuclei ...) starts:</text>
<rect x="900" y="142" width="40" height="24" rx="12" fill="#B45309" stroke="#B45309" stroke-width="0"/>
<text x="920.0" y="156" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ASK</text>
<text x="618" y="175" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Anything else:</text>
<rect x="706" y="162" width="46" height="24" rx="12" fill="#15803D" stroke="#15803D" stroke-width="0"/>
<text x="729.0" y="176" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">PASS</text>
<line x1="532" y1="148" x2="596" y2="148" stroke="#334155" stroke-width="1.8" marker-end="url(#a334155)"/>
<text x="564" y="140" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">no</text>
<line x1="410" y1="188" x2="410" y2="226" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#a1D4ED8)"/>
<text x="432" y="212" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">yes</text>
<rect x="36" y="232" width="360" height="232" rx="12" fill="#FEF2F2" stroke="#B42318" stroke-width="1.5"/>
<rect x="52" y="246" width="49" height="25" rx="12" fill="#B42318" stroke="#B42318" stroke-width="0"/>
<text x="76.5" y="261" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">DENY</text>
<circle cx="60" cy="292" r="3" fill="#B42318"/>
<text x="72" y="296" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Host is out of scope or not in scope</text>
<circle cx="60" cy="317" r="3" fill="#B42318"/>
<text x="72" y="321" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">In scope, but outside the testing window</text>
<circle cx="60" cy="342" r="3" fill="#B42318"/>
<text x="72" y="346" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Any target while the mode is static</text>
<circle cx="60" cy="367" r="3" fill="#B42318"/>
<text x="72" y="371" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">An in-scope name pointed at another address</text>
<text x="72" y="387" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">(--resolve, Host header)</text>
<circle cx="60" cy="408" r="3" fill="#B42318"/>
<text x="72" y="412" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Scope file unreadable or guard error (fails</text>
<text x="72" y="428" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">closed)</text>
<rect x="420" y="232" width="360" height="232" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
<rect x="436" y="246" width="107" height="25" rx="12" fill="#B45309" stroke="#B45309" stroke-width="0"/>
<text x="489.5" y="261" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ASK THE USER</text>
<circle cx="444" cy="292" r="3" fill="#B45309"/>
<text x="456" y="296" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Possible host given to a program the guard</text>
<text x="456" y="312" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">does not know</text>
<circle cx="444" cy="333" r="3" fill="#B45309"/>
<text x="456" y="337" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Targets in a file it cannot read, or an SSH</text>
<text x="456" y="353" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">alias</text>
<circle cx="444" cy="374" r="3" fill="#B45309"/>
<text x="456" y="378" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Command built at run time (pipe to shell,</text>
<text x="456" y="394" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">eval, decode)</text>
<circle cx="444" cy="415" r="3" fill="#B45309"/>
<text x="456" y="419" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Any change to the scope file or evidence log</text>
<circle cx="444" cy="440" r="3" fill="#B45309"/>
<text x="456" y="444" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Python missing while an engagement file exists</text>
<rect x="804" y="232" width="360" height="232" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<rect x="820" y="246" width="49" height="25" rx="12" fill="#15803D" stroke="#15803D" stroke-width="0"/>
<text x="844.5" y="261" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PASS</text>
<circle cx="828" cy="292" r="3" fill="#15803D"/>
<text x="840" y="296" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">In-scope host, active mode, inside the window</text>
<circle cx="828" cy="317" r="3" fill="#15803D"/>
<text x="840" y="321" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Support hosts: threat-intel feeds, standards</text>
<text x="840" y="337" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">bodies, registries</text>
<circle cx="828" cy="358" r="3" fill="#15803D"/>
<text x="840" y="362" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Calls that reach no host</text>
<circle cx="828" cy="383" r="3" fill="#15803D"/>
<text x="840" y="387" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">The plugin&#x27;s own scripts</text>
<circle cx="828" cy="408" r="3" fill="#15803D"/>
<text x="840" y="412" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Still subject to Claude&#x27;s normal permission</text>
<text x="840" y="428" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">prompts</text>
<rect x="36" y="480" width="1128" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="54" y="507" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Evidence log:</text>
<text x="146" y="507" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">every Bash, WebFetch and network-reaching MCP call, and every block, is written to a hash-chained, secret-redacted log.</text>
<text x="36" y="544" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">Not seen: a program that hides or computes its own target, server redirects, DNS tricks. Restrict outbound traffic at the OS or firewall when that matters.</text>
<text x="1170" y="542" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="end">github.com/unipicto/appaudit</text>
</svg>
